<!DOCTYPE html>
<html>
<head>
    <title>Oh :(</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(to bottom right, #ff99cc, #ff4d88);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* TOP TEXT */
        .top-text {
            margin-top: 30px; /* higher */
            margin-bottom: 40px;
        }

        .top-text h1 {
            color: white;
            font-size: 4em;
            margin: 0;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* HEART WRAPPER */
        .heart-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin-top: 60px; /* moves heart down */
            animation: float 3s ease-in-out infinite;
        }

        /* HEART SHAPE */
        .heart {
            position: absolute;
            width: 320px;
            height: 320px;
            background: pink;
            transform: rotate(-45deg);
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            background: pink;
            border-radius: 50%;
        }

        .heart::before {
            top: -160px;
            left: 0;
        }

        .heart::after {
            left: 160px;
            top: 0;
        }

        /* IMAGES */
        .images {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            transform: translateY(-20px); /* centered inside heart */
            z-index: 2;
        }

        .images img {
            width: 150px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        /* BOTTOM SECTION */
        .bottom-section {
            margin-top: 120px; /* clearance from heart */
            text-align: center;
            color: white;
            position: relative;
        }

        .bottom-section p {
            font-size: 1.6em;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            margin: 10px;
        }

        #changeMind {
            background-color: white;
            color: #d6336c;
        }

        #noAgain {
            background-color: #d6336c;
            color: white;
            position: absolute;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

<div class="top-text">
    <h1>Oh :(</h1>
</div>

<div class="heart-wrapper">
    <div class="heart"></div>

    <div class="images">
        <img src="images/image2.jpg">
        <img src="images/image3.jpg">
    </div>
</div>

<div class="bottom-section">
    <p>but think of the mems</p>

    <button id="changeMind" onclick="window.location.href='page3.html'">
        I changed my mind
    </button>

    <button id="noAgain">I dont wanna be ur valentine</button>
</div>

<script>
    const noBtn = document.getElementById("noAgain");

    noBtn.addEventListener("mouseover", function() {
        const x = Math.random() * (window.innerWidth - 220);
        const y = Math.random() * (window.innerHeight - 120);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });
</script>

</body>
</html>
