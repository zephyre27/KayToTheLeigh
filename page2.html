<!DOCTYPE html>
<html>
<head>
    <title>Oh :(</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(to bottom right, #ff99cc, #ff4d88);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .wrapper {
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 4em;
            margin-bottom: 40px;
        }

        .heart {
            position: relative;
            width: 350px;
            height: 300px;
            background: pink;
            transform: rotate(-45deg);
            animation: float 3s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            width: 350px;
            height: 300px;
            background: pink;
            border-radius: 50%;
        }

        .heart:before {
            top: -175px;
            left: 0;
        }

        .heart:after {
            left: 175px;
            top: 0;
        }

        .images {
            transform: rotate(45deg);
            display: flex;
            gap: 20px;
        }

        .images img {
            width: 120px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        @keyframes float {
            0%, 100% { transform: rotate(-45deg) translateY(0); }
            50% { transform: rotate(-45deg) translateY(-15px); }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>Oh :(</h1>

    <div class="heart">
        <div class="images">
            <img src="images/image2.jpg">
            <img src="images/image3.jpg">
        </div>
    </div>
</div>

</body>
</html>
