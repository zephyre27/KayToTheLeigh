<!DOCTYPE html>
<html>
<head>
    <title>Oh :(</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(to bottom right, #ff99cc, #ff4d88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* push content from top */
            font-family: Arial, sans-serif;
            padding-top: 80px; /* moves text higher */
        }

        /* TEXT */
        .text-section {
            margin-bottom: 80px; /* space between text and heart */
        }

        .text-section h1 {
            color: white;
            font-size: 4em;
            margin: 0;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* HEART WRAPPER */
        .heart-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            animation: float 3s ease-in-out infinite;
        }

        /* HEART SHAPE */
        .heart {
            position: absolute;
            width: 300px;
            height: 300px;
            background: pink;
            transform: rotate(-45deg);
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: pink;
            border-radius: 50%;
        }

        .heart::before {
            top: -150px;
            left: 0;
        }

        .heart::after {
            left: 150px;
            top: 0;
        }

        /* IMAGE CONTAINER (upright now) */
        .images {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 2;
        }

        .images img {
            width: 120px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

<div class="text-section">
    <h1>Oh :(</h1>
</div>

<div class="heart-wrapper">
    <div class="heart"></div>

    <div class="images">
        <img src="images/image2.jpg">
        <img src="images/image3.jpg">
    </div>
</div>

</body>
</html>
