<!DOCTYPE html>
<html>
<head>
    <title>Oh :(</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: url("images/image2.jpg") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: white;
        }

        .content {
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .floating-img {
            width: 200px;
            border-radius: 20px;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

<div class="content">
    <h1>Oh :(</h1>
    <img src="images/image3.jpg" class="floating-img">
</div>

</body>
</html>
