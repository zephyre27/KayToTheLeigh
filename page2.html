<!DOCTYPE html>
<html>
<head>
    <title>You Tried to Say No 😌</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(to bottom right, #ff99cc, #ff4d88);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .heart {
            position: relative;
            width: 300px;
            height: 270px;
            background: pink;
            transform: rotate(-45deg);
            animation: float 3s ease-in-out infinite;
        }

        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            width: 300px;
            height: 270px;
            background: pink;
            border-radius: 50%;
        }

        .heart:before {
            top: -150px;
            left: 0;
        }

        .heart:after {
            left: 150px;
            top: 0;
        }

        .floating-img {
            position: absolute;
            width: 100px;
            border-radius: 15px;
            transform: rotate(45deg);
            animation: bob 4s ease-in-out infinite;
        }

        .img1 {
            top: 40px;
            left: 60px;
        }

        .img2 {
            bottom: 40px;
            right: 60px;
        }

        @keyframes float {
            0%, 100% { transform: rotate(-45deg) translateY(0); }
            50% { transform: rotate(-45deg) translateY(-10px); }
        }

        @keyframes bob {
            0%, 100% { transform: rotate(45deg) translateY(0); }
            50% { transform: rotate(45deg) translateY(-10px); }
        }
    </style>
</head>
<body>

<div class="heart">
    <img src="images/image1.jpg" class="floating-img img1">
    <img src="images/image2.jpg" class="floating-img img2">
</div>

</body>
</html>
