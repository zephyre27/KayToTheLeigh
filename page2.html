<!DOCTYPE html>
<html>
<head>
    <title>Oh :(</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(to bottom right, #ff99cc, #ff4d88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            font-size: 4em;
            margin-bottom: 30px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .heart-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            animation: float 3s ease-in-out infinite;
        }

        /* Main heart square */
        .heart {
            width: 300px;
            height: 300px;
            background: pink;
            position: absolute;
            transform: rotate(-45deg);
            top: 0;
            left: 0;
        }

        /* Top circles */
        .heart::before,
        .heart::after {
            content: "";
            width: 300px;
            height: 300px;
            background: pink;
            border-radius: 50%;
            position: absolute;
        }

        .heart::before {
            top: -150px;
            left: 0;
        }

        .heart::after {
            left: 150px;
            top: 0;
        }

        /* Images centered inside heart */
        .images {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            transform: rotate(45deg);
        }

        .images img {
            width: 110px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
