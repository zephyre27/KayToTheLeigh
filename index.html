<!DOCTYPE html>
<html>
<head>
    <title>Happy Valentine's Day ❤️</title>
    <style>
        body {
            background-color: #ffe6f0;
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 100px;
        }
        h1 {
            font-size: 3em;
            color: #d6336c;
        }
        p {
            font-size: 1.5em;
        }
        button {
            padding: 15px 25px;
            font-size: 1em;
            background-color: #ff4d88;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e6005c;
        }
    </style>
</head>
<body>

<h1>Happy Valentine's Day 💕</h1>
<p>Click the button for a surprise</p>

<button onclick="showMessage()">Click Me</button>

<script>
    function showMessage() {
        alert("I love you more than coffee ☕❤️");
    }
</script>

</body>
</html>
