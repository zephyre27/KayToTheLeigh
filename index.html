<!DOCTYPE html>
<html>
<head>
    <title>Be My Valentine 💕</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            /* Updated Background Settings */
            background-image: url("images/image1.jpg");
            background-repeat: no-repeat;
            background-size: 105%; /* slightly zoomed out */
            background-position: center 10%; /* shows more top */

            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .overlay {
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 40px;
            border-radius: 20px;
            color: white;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            position: absolute;
        }

        #yesBtn {
            background-color: #ff4d88;
            color: white;
        }

        #noBtn {
            background-color: white;
            color: #d6336c;
            left: 50%;
            top: 65%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

<div class="overlay">
    <h1>Kay will you be my Valentine? 💖</h1>
</div>

<button id="yesBtn">Yes</button>
<button id="noBtn" onclick="window.location.href='page2.html'">No</button>

<script>
    const yesBtn = document.getElementById("yesBtn");

    yesBtn.style.left = "45%";
    yesBtn.style.top = "65%";

    yesBtn.addEventListener("mouseover", function() {
        const x = Math.random() * (window.innerWidth - 120);
        const y = Math.random() * (window.innerHeight - 60);
        yesBtn.style.left = x + "px";
        yesBtn.style.top = y + "px";
    });
</script>

</body>
</html>
